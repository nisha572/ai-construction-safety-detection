# BoT-SORT with the dedicated pretrained YOLO26 ReID encoder (yolo26n-reid.onnx).
# Identical motion tuning to bytetrack_construction.yaml; appearance matching uses
# the purpose-built person-reidentification model instead of backbone features.
tracker_type: botsort
track_high_thresh: 0.3
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 300
match_thresh: 0.85
fuse_score: true
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: true
model: yolo26n-reid.onnx
